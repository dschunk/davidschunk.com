<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Layered green mountain landscape</title>
  <desc id="desc">Abstract evergreen mountains and forest ridges in deep green tones.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#738b7b"/>
      <stop offset=".34" stop-color="#466555"/>
      <stop offset="1" stop-color="#0b241b"/>
    </linearGradient>
    <linearGradient id="glow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6c49d" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#8ca08c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#17372a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315342"/>
      <stop offset="1" stop-color="#16382a"/>
    </linearGradient>
    <linearGradient id="ridgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173b2c"/>
