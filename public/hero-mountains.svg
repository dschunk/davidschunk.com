  <path d="M0 642 86 590 150 622 216 546 282 605 350 520 418 596 490 522 566 602 640 515 710 584 780 532 855 611 930 520 1010 592 1088 510 1160 580 1238 514 1315 598 1398 530 1470 600 1540 548 1600 580V760H0Z" fill="url(#ridgeC)"/>
