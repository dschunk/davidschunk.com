name: Validate davidschunk.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davidschunk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Rendered HTML test
        run: node --test tests/rendered-html.test.mjs

      - name: UI component tests
        run: node --test tests/ui-components.test.mjs

      - name: Wrangler configuration dry run
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
